<div class="min-h-screen bg-[#f8f8f8] p-6 font-sans">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <div class="flex flex-col gap-1">
      <h3 class="font-semibold text-lg">Role Manager for {{ tenant?.name }}</h3>
      <p class="text-xs text-gray-500">Assign and manage roles for this tenant</p>
    </div>
    <p-button 
      label="Add Role" 
      icon="pi pi-plus" 
      size="small"
      (onClick)="toggleAddRoleModal()" 
      severity="contrast">
    </p-button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <p-progressSpinner></p-progressSpinner>
  </div>

  <!-- Main Content -->
  <div *ngIf="!loading && tenant">
    <div class="mt-4">
      <p-card>
        <p class="text-sm font-semibold mb-2">Assigned Roles</p>
        <p-divider />

        <!-- Available Roles Header -->
        <div *ngIf="roles.length > 0" class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
          <p class="text-xs font-semibold text-gray-700 mb-2">Available Roles:</p>
          <div class="flex flex-wrap gap-2">
            <p-tag *ngFor="let role of roles" [value]="role.role" severity="secondary"></p-tag>
          </div>
        </div>

        <!-- Tenant Role Assignment -->
        <p-table 
          [value]="roles" 
          [tableStyle]="{ 'min-width': '50rem' }"
          styleClass="p-datatable-sm">
          
          <ng-template pTemplate="header">
            <tr>
              <th class="text-left" style="width: 30%">Role</th>
              <th class="text-center" style="width: 15%">Assigned</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-role>
            <tr>
              <td class="text-left">
                <p class="font-semibold text-sm">{{ role.role }}</p>
              </td>

              <td class="text-center">
                <p-checkbox 
                  [binary]="true" 
                  [ngModel]="hasRole(this.tenant,role.id)" 
                  (onChange)="toggleRole(this.tenant,role)">
                </p-checkbox>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="2" class="text-center py-8">
                <i class="pi pi-user text-4xl text-gray-400 mb-2"></i>
                <p class="text-gray-500">No roles available</p>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>
  </div>

</div>

<!-- Add Role Modal -->
<p-dialog
  [(visible)]="showAddRoleModal"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [draggable]="false"
  header="Create New Role"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [baseZIndex]="10000"
  contentStyleClass="px-2">

  <p class="text-sm text-gray-500 mb-4">
    Enter a unique name for the new role (e.g., "MANAGER", "RESIDENT", "GUEST").
  </p>

  <div class="flex flex-col gap-5 mt-2">
    <p-floatlabel variant="on">
      <input 
        pInputText 
        id="roleName" 
        [(ngModel)]="roleName"
        class="w-full"
        (keydown.enter)="addRole(roleName)"
      />
      <label for="roleName">Role Name</label>
    </p-floatlabel>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3 w-full mt-4">
      <p-button 
        label="Cancel" 
        (click)="toggleAddRoleModal()" 
        severity="secondary"
        [text]="true"
        class="px-4">
      </p-button>

      <p-button 
        label="Create Role" 
        (click)="addRole(roleName)" 
        severity="contrast"
        [disabled]="!roleName.trim()"
        class="px-4">
      </p-button>
    </div>
  </ng-template>
</p-dialog>
