<div class="h-screen flex overflow-hidden">

  <!-- Sidebar (fixed) -->
  <app-sidebar
    [mobileOpen]="mobileOpen"
    (closeMobile)="mobileOpen = false"
    class="shrink-0"
  ></app-sidebar>

  <!-- Right side -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Menubar (fixed) -->
    <app-menubar
      (toggleSidebar)="mobileOpen = true"
      class="shrink-0"
    ></app-menubar>

    <!-- Scrollable content ONLY -->
    <main class="flex-1 overflow-y-auto bg-[#F8F8F8] p-4">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
